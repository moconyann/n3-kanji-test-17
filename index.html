function render() {
  const lang = document.getElementById("language").value;
  const c = content[lang];
  document.documentElement.lang = lang === "ja" ? "ja" : lang;
  document.getElementById("pageTitle").textContent = c.title;
  document.getElementById("pageSubtitle").textContent = c.subtitle;
  document.getElementById("introText").textContent = c.intro;

  const html = questions.map(q => {
    const opts = q.options.map((o, i) =>
      `<div class="option ${i + 1 === q.correct ? "correct" : ""}">
        ${i + 1}. ${o}${i + 1 === q.correct ? " ✓" : ""}
      </div>`).join("");
    return `<article class="question">
      <div class="question-title">
        <span class="number">問題 ${q.n}</span>
        <span class="badge">1点</span>
      </div>
      <div class="sentence">${q.sentence[lang]}</div>
      <div class="options">${opts}</div>
      <div class="answer">${c.answer}: ${q.correct}. ${q.options[q.correct - 1]}</div>
      <p class="explanation"><strong>${c.explanation}</strong><br>${q.exp[lang]}</p>
    </article>`;
  }).join("");
  document.getElementById("questions").innerHTML = html;
}

document.getElementById("language").addEventListener("change", render);
render();
</script>
